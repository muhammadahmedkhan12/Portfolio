<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="akGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ED4D6"/>
      <stop offset="100%" stop-color="#1A6B8A"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#060D1B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#4DBDC0" stroke-width="2" stroke-opacity="0.6"/>
  
  <!-- AK Monogram -->
  <g filter="url(#glow)">
    <!-- Letter A -->
    <path d="M16 46 L27 18 L33 18 L44 46 L37.5 46 L35 39.5 L24.5 39.5 L22 46 Z M26 34.5 L33.5 34.5 L29.8 24.5 Z" fill="url(#akGrad)"/>
    
    <!-- Letter K Overlay -->
    <path d="M38 18 L44 18 L44 29 L48.5 18 L55 18 L48 31 L55.5 46 L49 46 L43 33.5 L44 46 L38 46 Z" fill="#5ED4D6"/>
  </g>
  
  <!-- Subtle glowing dot -->
  <circle cx="51" cy="15" r="2.5" fill="#4DBDC0" filter="url(#glow)"/>
</svg>
